# Redirect www -> non-www (HTTP)
server {
    listen 80;
    listen [::]:80;
    server_name www.freshs.pk;
    return 301 http://freshs.pk$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name freshs.pk;

    client_max_body_size 20M;

    # Serve static images directly via nginx
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|pdf)$ {
        root /var/www/freshs-pk/public;
        access_log off;
        expires max;
        add_header Cache-Control "public, immutable";
    }

    # Proxy all requests to Next.js (port 3002)
    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
